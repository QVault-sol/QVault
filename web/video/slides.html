<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QVault video slides</title>
<style>
@font-face { font-family: "Archivo"; src: url("../public/assets/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
:root { --paper: #dce2e5; --ink: #0f2a44; --ink-2: #3e556b; --brass: #b9832a; --door: #cbd3d8; --line: #a9b7c3; --bad: #9a2b1f; --good: #1f5e3a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Archivo", sans-serif; font-stretch: 100%; overflow: hidden; }
.slide { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 80px; align-items: center; padding: 0 120px; }
.slide.text-only { grid-template-columns: minmax(0, 1fr); }
h1 { margin: 0 0 26px; font-size: 80px; line-height: 1.02; font-weight: 800; font-stretch: 115%; letter-spacing: -0.025em; max-width: 17ch; }
p { margin: 0; font-size: 34px; line-height: 1.35; color: var(--ink-2); max-width: 34ch; }
.kicker { font-size: 26px; font-weight: 700; color: var(--brass); margin-bottom: 16px; }
.foot { position: absolute; left: 120px; top: 48px; font-size: 22px; color: var(--ink-2); }
.foot b { color: var(--ink); }
.warn { display: inline-block; margin-top: 32px; padding: 10px 18px; border: 2px solid var(--bad); color: var(--bad); border-radius: 6px; font-size: 24px; font-weight: 700; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 30px; max-width: 1200px; }
.cmp div { background: #fbfcfc; border: 2px solid var(--line); border-radius: 8px; padding: 26px 30px; font-size: 30px; line-height: 1.35; }
.cmp h2 { margin: 0 0 8px; font-size: 32px; }
.addr { font: 600 30px/1.3 ui-monospace, Menlo, monospace; color: var(--bad); background: #fbfcfc; border: 2px dashed var(--bad); border-radius: 8px; padding: 14px 18px; margin-top: 26px; display: inline-block; }
svg { width: 100%; }
.door { transform-origin: 120px 120px; animation: turn 9s linear infinite; }
@keyframes turn { to { transform: rotate(40deg); } }
.door .frame { fill: none; stroke: var(--ink); stroke-width: 3; }
.door .ring { fill: none; stroke: var(--line); stroke-width: 1.2; }
.door .leaf { fill: var(--door); stroke: var(--ink); stroke-width: 2.5; }
.door .bolt { fill: var(--brass); stroke: var(--ink); stroke-width: 1.2; }
.door .spoke { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.door .knob { fill: var(--ink); }
.door .hub { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.caption {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50;
  max-width: min(980px, calc(100vw - 48px)); padding: 14px 22px; border-radius: 8px;
  background: rgba(15, 42, 68, .94); color: #fff; font-size: 22px; line-height: 1.35; text-align: center;
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SCENES = {
  title: `<div class="slide"><div>
      <div class="kicker">Crypto World's Fair Hackathon</div>
      <h1>QVault</h1>
      <p>A quantum-safe vault for SOL and SPL tokens on Solana.</p>
      <div class="warn">Devnet prototype. Not audited.</div></div>
      <div>{{door}}</div>
      <div class="foot"><b>qvault-sol.github.io/QVault</b> &nbsp;&nbsp; github.com/QVault-sol/QVault</div></div>`,
  problem: `<div class="slide text-only"><div>
      <div class="kicker">The problem</div>
      <h1>On Solana, your address is your public key.</h1>
      <p>Ed25519 keys are visible to everyone. A large enough quantum computer could compute the private key behind any of them.</p>
      <div class="addr">GcDnFhLESFBYmyGfq5L9bTgf1aAuiV7tZdk3cH2G5LPD</div></div></div>`,
  idea: `<div class="slide"><div>
      <div class="kicker">The idea</div>
      <h1>No private key on-chain.</h1>
      <p>Funds sit in a program account that opens only with a Winternitz one-time signature: hash-based, SHA-256, verified by the program.</p></div>
      <div>{{door}}</div></div>`,
  diff: `<div class="slide text-only"><div>
      <div class="kicker">What is new</div>
      <h1>SOL and tokens in one quantum-safe vault.</h1>
      <div class="cmp">
        <div><h2>Existing Winternitz vaults</h2>SOL only.</div>
        <div><h2>QVault</h2>SOL, SPL tokens like USDC, and Token-2022.</div>
      </div></div></div>`,
  biz: `<div class="slide text-only"><div>
      <div class="kicker">Business</div>
      <h1>0.1&nbsp;% only when you pay someone else.</h1>
      <p>Rotating into your own next vault is free. First customers: protocol and DAO treasuries. Then wallet integrations.</p></div></div>`,
  outro: `<div class="slide"><div>
      <div class="kicker">Status</div>
      <h1>Open source. Tested. Devnet.</h1>
      <p>Attack tests, Rust/Python/JS signatures cross-checked, and a CI that runs this exact flow in a real browser.</p>
      <div class="warn">Not audited. External audit before any mainnet launch.</div></div>
      <div>{{door}}</div>
      <div class="foot"><b>qvault-sol.github.io/QVault</b> &nbsp;&nbsp; github.com/QVault-sol/QVault</div></div>`,
};

function door() {
  const cx = 120, cy = 120, rf = 112, rd = rf * 0.74;
  let s = `<svg viewBox="0 0 240 240"><g class="door"><circle cx="${cx}" cy="${cy}" r="${rf}" class="frame"/><circle cx="${cx}" cy="${cy}" r="${rf * 0.93}" class="ring"/><circle cx="${cx}" cy="${cy}" r="${rd}" class="leaf"/>`;
  for (let i = 0; i < 30; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 30;
    const L = 0.2 + 0.8 * Math.abs(Math.sin(i * 2.3 + 1));
    const r0 = rd * 0.9, r1 = rd + (rf * 0.93 - rd) * L;
    const x0 = cx + r0 * Math.cos(a), y0 = cy + r0 * Math.sin(a);
    s += `<rect x="${x0}" y="${y0 - 2.6}" width="${r1 - r0}" height="5.2" rx="1.3" class="bolt" transform="rotate(${(a * 180) / Math.PI} ${x0} ${y0})"/>`;
  }
  for (let k = 0; k < 3; k++) {
    const a = -Math.PI / 2 + (k * 2 * Math.PI) / 3 + Math.PI / 6;
    const x1 = cx + rd * 0.55 * Math.cos(a), y1 = cy + rd * 0.55 * Math.sin(a);
    s += `<line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" class="spoke"/><circle cx="${x1}" cy="${y1}" r="5" class="knob"/>`;
  }
  return s + `<circle cx="${cx}" cy="${cy}" r="19" class="hub"/><circle cx="${cx}" cy="${cy}" r="7" class="knob"/></g></svg>`;
}

function show(name) {
  document.getElementById("root").innerHTML = SCENES[name].replaceAll("{{door}}", door());
}
show(new URLSearchParams(location.search).get("scene") || "title");
window.show = show;
</script>
</body>
</html>
