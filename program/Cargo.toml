[package]
name = "qvault"
version = "0.1.0"
edition = "2021"
description = "Quantum-safe vault for SOL and SPL tokens using Winternitz one-time signatures"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "4.0"
solana-system-interface = { version = "3", features = ["bincode"] }

[dev-dependencies]
solana-program-test = { version = "=4.2.2", features = ["agave-unstable-api"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-instruction = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
