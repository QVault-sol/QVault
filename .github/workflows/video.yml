name: Demo video

# Records the narrated demo video against devnet and publishes it on the
# `demo-video` branch (qvault-demo.mp4 + qvault-demo.srt).

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Narration engine"
        type: choice
        options: [kokoro, voicestudio]
        default: kokoro
      kokoro_voice:
        description: "Kokoro voice (af_heart, af_bella, bf_emma, am_michael, bm_george, am_fenrir)"
        default: af_heart

permissions:
  contents: write

concurrency: devnet-demo

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build web app
        working-directory: web
        run: npm ci && npm run build

      - name: Install recorder, voices and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install playwright piper-tts solders "kokoro>=0.9" soundfile
          python -m playwright install --with-deps chromium
          mkdir -p ~/voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium
          curl -sSfL -o ~/voices/en_US-lessac-medium.onnx "$base/en_US-lessac-medium.onnx" \
            && curl -sSfL -o ~/voices/en_US-lessac-medium.onnx.json "$base/en_US-lessac-medium.onnx.json" \
            || echo "::warning::voice download failed – captions only"

      - name: Free disk space for VoiceStudio
        if: inputs.engine == 'voicestudio'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1

      - name: Narration with VoiceStudio (VoxCPM2 voice design)
        id: voicestudio
        if: inputs.engine == 'voicestudio'
        continue-on-error: true
        env:
          IMAGE: ghcr.io/debpalash/voicestudio:stable
        run: |
          export OMNIVOICE_API_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$OMNIVOICE_API_KEY"
          docker pull -q "$IMAGE"
          docker run -d --name vs -p 127.0.0.1:3900:3900 \
            -e OMNIVOICE_API_KEY="$OMNIVOICE_API_KEY" -e OMNIVOICE_ANALYTICS_DISABLED=1 \
            -e OMNIVOICE_TTS_BACKEND=voxcpm2 -v vsdata:/app/omnivoice_data "$IMAGE"
          docker exec vs python3 -m pip install -q "voxcpm>=2.0.3"
          docker restart vs
          python web/video/voicestudio_tts.py || { docker logs --tail 80 vs; exit 1; }
          docker rm -f vs && docker volume rm vsdata && docker image prune -af >/dev/null

      - name: Voice samples
        continue-on-error: true
        run: python web/video/voice_samples.py

      - name: Record on devnet
        env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
          PIPER_MODEL: /home/runner/voices/en_US-lessac-medium.onnx
          KOKORO_VOICE: ${{ inputs.kokoro_voice }}
        run: |
          if [ "${{ inputs.engine }}" = "voicestudio" ] && [ "${{ steps.voicestudio.outcome }}" != "success" ]; then
            echo "::warning::VoiceStudio narration failed – falling back to Kokoro"
            rm -rf web/video/out/voice
          fi
          python web/video/record.py

      - uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: |
            web/video/out/qvault-demo.mp4
            web/video/out/qvault-demo.srt
            web/video/out/voice-samples.mp4

      - name: Publish to the demo-video branch
        run: |
          mkdir pub && cp web/video/out/qvault-demo.mp4 web/video/out/qvault-demo.srt pub/
          cp web/video/out/voice-samples.mp4 pub/ 2>/dev/null || true
          cd pub
          git init -q -b demo-video
          git config user.name "QVault"
          git config user.email "340000283+QVault-sol@users.noreply.github.com"
          git add . && git commit -qm "Demo video recorded on devnet (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" demo-video
