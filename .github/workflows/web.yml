name: Web app

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the browser test against devnet"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, test core, build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public

  e2e-devnet:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - name: Install Playwright
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser test on devnet
        env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
        run: python web/test/e2e_devnet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web/test/screens/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
